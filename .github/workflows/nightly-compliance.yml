name: Nightly compliance

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-compliance
  cancel-in-progress: false

jobs:
  compliance:
    name: Full compliance suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint and Node come from mise.toml and mise.lock,
      # checksum-verified, so `make ci` runs exactly the pinned releases.
      - name: Install golangci-lint and Node
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: golangci-lint node
          cache: true

      - name: Install compliance tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Install E2E runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus-x11 \
            libadwaita-1-0 \
            libgtk-4-1 \
            x11-utils \
            xauth \
            xvfb

      - name: Run host-independent compliance gates
        run: make ci

      - name: Run end-to-end compliance gates
        run: make e2e

      - name: Scan Go code and dependencies for known vulnerabilities
        run: govulncheck ./...
