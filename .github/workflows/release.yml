# .github/workflows/release.yml
name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - "*"

permissions:
  contents: write
  # id-token and attestations let actions/attest-build-provenance sign the
  # release assets with GitHub's Sigstore instance. frostyard/apt-publisher
  # verifies every .deb with `gh attestation verify --source-ref
  # refs/tags/<tag>` before publishing it.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # More assembly might be required: Docker logins, GPG, etc.
      # It all depends on your needs.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser-pro
          # 'latest', 'nightly', or a semver
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Your GoReleaser Pro key, if you are using the 'goreleaser-pro' distribution
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      # Build provenance binds each release asset and checksums.txt to this
      # tag's workflow run. It must run before the publication request:
      # apt-publisher refuses a .deb without provenance from refs/tags/<tag>.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk

      # The .deb files are published by frostyard/apt-publisher, the single
      # Debian writer (frostyard/core ADR-0055). It downloads every .deb asset
      # of this release, verifies its provenance, publishes it, and then
      # dispatches `build` to the image repositories registered for chairlift
      # (ADR-0056). Not continue-on-error: if this request fails, nothing was
      # published and the release run must fail.
      - name: Request APT publication
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.APT_PUBLISH_TOKEN }}
          repository: frostyard/apt-publisher
          event-type: publish-deb
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ github.ref_name }}"}'
