# .github/workflows/snapshot.yml
name: snapshot

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches:
      - main

# Nightlies replace the same dev tag and release. Cancel stale runs before a
# newer one publishes so concurrent GoReleaser uploads cannot collide.
concurrency:
  group: goreleaser-nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Only run if the Tests workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # The rolling dev prerelease is the last step. It is not published to
      # the APT repository and dispatches no image build: apt-publisher
      # publishes tag releases only, and it dispatches `build` to the image
      # repositories after those packages are live (frostyard/core ADR-0055,
      # ADR-0056).
      - name: Run GoReleaser Snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --nightly --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
