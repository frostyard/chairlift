# Example ChairLift Configuration for Non-Snow Linux Distributions
# This configuration disables Snow Linux-specific features like Homebrew
# while keeping universal features enabled.
#
# To use this configuration:
# 1. Install frostyard-chairlift-system-integration when the GUI is user-scoped
# 2. Provide a trusted staging helper at /usr/libexec/bootc-update-stage
# 3. Copy this file to /etc/chairlift/config.yml
# 4. Modify as needed for your distribution
# 5. Restart ChairLift

system_page:
  system_info_group:
    enabled: true  # Show OS information
  bootc_status_group:
    enabled: true  # Show bootc system status
  health_group:
    enabled: true  # Show system health monitoring
    app_id: io.missioncenter.MissionCenter  # App to launch for system monitoring

updates_page:
  bootc_updates_group:
    enabled: true  # Requires /usr/libexec/bootc-update-stage
  sysupdate_updates_group:
    enabled: false  # Native A/B (systemd-sysupdate) hosts only; requires /usr/libexec/snosi-sysupdate-stage
  brew_updates_group:
    enabled: false  # Hide Homebrew updates (not typically used on other distros)
  brew_trust_group:
    enabled: false  # Hide Homebrew tap trust (not typically used on other distros)
  firmware_updates_group:
    enabled: true  # Shown only when fwupdmgr is installed

applications_page:
  applications_installed_group:
    enabled: true  # Show Flatpak management
    app_id: io.github.kolunmi.Bazaar  # App to launch for Flatpak management (e.g., org.gnome.Software)
  brew_group:
    enabled: false  # Hide Homebrew package list
  brew_search_group:
    enabled: false  # Hide Homebrew search
  brew_bundles_group:
    enabled: false  # Hide Homebrew bundles
    bundles_paths:
      - /usr/share/snow/bundles  # List of directories containing Brewfile bundles

maintenance_page:
  maintenance_cleanup_group:
    enabled: true  # Show cleanup tools
    actions:
      - title: Clean Up Boot Entries  # Display title for the action
        script: /usr/libexec/bls-gc  # Path to the script to execute
        sudo: true  # Whether the script requires administrator privileges
  maintenance_optimization_group:
    enabled: true  # Show optimization tools

features_page:
  features_group:
    enabled: false  # Enable only when updex is configured for this distribution

problems_page:
  problems_system_group:
    enabled: true  # Problems recorded by snosi-health; shows "not available" when /var/lib/snosi-health/problems.json is absent
  problems_apps_group:
    enabled: true  # The user's own crashes (coredumpctl) and frostyard app problem records (user journal)
  problems_reporting_group:
    enabled: true  # Phase 1: states that problem reports stay on this computer

help_page:
  help_resources_group:
    enabled: true  # Show help resources
    website: https://github.com/frostyard/chairlift
    issues: https://github.com/frostyard/chairlift/issues
    chat: https://github.com/frostyard/chairlift/discussions

first_run_page:
  first_run_apps_group:
    enabled: true  # Used only by `chairlift --first-run`; ChairLift ships no autostart entry, so nothing starts it unless your image does
    apps_path: /usr/share/snow/first-run/apps.json  # Application list for the first run's Apps step; a missing or invalid list hides the step
