# ChairLift Configuration
# This file controls which preference groups are shown in the application
# Set "enabled: false" to hide a group's card on any page. A page is omitted
# when all of its groups are disabled; the Overview always shows (system_page
# configures its cards), and help_page configures the Help dialog (F1).

system_page:
  system_info_group:
    enabled: true
  bootc_status_group:
    enabled: true
  health_group:
    enabled: true
    app_id:
      - org.gnome.SystemMonitor
      - org.kde.plasma-systemmonitor

updates_page:
  bootc_updates_group:
    enabled: true
  sysupdate_updates_group:
    enabled: true
  flatpak_updates_group:
    enabled: true
  brew_updates_group:
    enabled: true
  brew_trust_group:
    enabled: true
  firmware_updates_group:
    enabled: true  # Shown only when fwupdmgr is installed

applications_page:
  applications_installed_group:
    enabled: true
    app_id: io.github.kolunmi.Bazaar
  flatpak_user_group:
    enabled: true
  flatpak_system_group:
    enabled: true
  brew_group:
    enabled: true
  brew_search_group:
    enabled: true
  brew_bundles_group:
    enabled: true
    bundles_paths:
      - /usr/share/snow/bundles

maintenance_page:
  maintenance_cleanup_group:
    enabled: false
    actions:
      - title: Clean Up Boot Old Entries
        script: /usr/libexec/bls-gc
        sudo: true
  maintenance_brew_group:
    enabled: true
  maintenance_flatpak_group:
    enabled: true

features_page:
  features_group:
    enabled: true

problems_page:
  # System problems recorded by snosi-health (/var/lib/snosi-health) and the
  # user's own crashes and app problem records. Reporting is opt-in per user
  # and off until the user turns it on (ADR-0015).
  problems_system_group:
    enabled: true
  problems_apps_group:
    enabled: true
  problems_reporting_group:
    enabled: true
    # Report endpoint. Only /etc/chairlift/config.yml and
    # /usr/share/chairlift/config.yml may set it; this fallback file may not.
    # endpoint: https://report.frostyard.org/v1/report

help_page:
  help_resources_group:
    enabled: true
    website: https://github.com/frostyard/snosi
    issues: https://github.com/frostyard/snosi/issues
    chat: https://github.com/frostyard/snosi/discussions

# Not a navigation page: it configures `chairlift --first-run` (ADR-0014).
# The Apps step shows only when this group is enabled, the list at apps_path
# is valid, and the connection check found the internet.
first_run_page:
  first_run_apps_group:
    enabled: true
    apps_path: /usr/share/snow/first-run/apps.json
